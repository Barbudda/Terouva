[package]
name = "terouva"
version = "0.1.0"
description = "Local-first rental copilot for Leboncoin"
authors = ["Hugo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "terouva_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls"], default-features = false }
scraper = "0.20"
url = "2"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"

# Release profile: optimize for small binary size + LTO.
# Trade-off: slower release build (a few extra minutes), much smaller .msi.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
