name: build

# Catches regressions before they hit main. Each app builds independently
# so a broken Rust crate doesn't fail the web check and vice-versa.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/release-notes/**"
      - "CHANGELOG.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  redlines:
    name: lignes rouges · zéro serveur + zéro requête LBC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check red lines (no app/api, no fetch leboncoin.fr)
        run: node scripts/check-redlines.mjs

  core:
    name: core · @terouva/core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/core/package-lock.json
      - name: Install deps
        working-directory: packages/core
        run: npm ci
      - name: Unit tests (vitest)
        working-directory: packages/core
        run: npm test

  web:
    name: web · Next.js build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install deps
        working-directory: apps/web
        run: npm ci
      - name: Unit tests (vitest — couche IndexedDB)
        working-directory: apps/web
        run: npm test
      - name: Build
        working-directory: apps/web
        run: npm run build

  desktop-frontend:
    name: desktop · TS + Vite build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install deps
        working-directory: apps/desktop
        run: npm ci
      - name: Unit tests (vitest)
        working-directory: apps/desktop
        run: npm test
      - name: Build
        working-directory: apps/desktop
        run: npm run build

  desktop-rust:
    name: desktop · cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
